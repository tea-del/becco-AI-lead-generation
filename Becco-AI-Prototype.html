      const name=state.leadDetail||'星子';
      const title='玻璃钢卡通吉祥物源头厂家来了，这是一款为服装店、美妆店、饭店、酒吧等场景设计的卡拍照雕塑';
      return modalShell(state.leadFocus==='analysis'?`分析 TA · ${name}`:`用户详情 · ${name}`,state.leadFocus==='analysis'?'基于 TA 的评论和来源帖生成需求判断。':'查看用户、评论与来源帖内容。',`<section class="lead-detail-demand"><strong>AI 需求概述</strong><p>${name} 想确认产品的材质、可选款式和购买方式，具有明确的行动信号与落地意图。</p></section><section class="source-post"><div class="source-post-head"><div><span class="badge">来源帖</span><p class="source-post-title">${title}</p></div><button class="btn btn-quiet" data-action="open-source-post">在小红书查看 ↗</button></div><div class="source-post-body">玻璃钢卡通吉祥物源头厂家来了，这是我们自主设计生产的一款打卡拍照雕塑，适合摆放在服装店、美妆店、饭店、酒吧、公园等多场景使用。摆放在店铺门口，非常吸引人气哦，喜欢这款造型的欢迎私信咨询！ #打卡拍照 #门店设计 #门店引流</div><div class="source-post-meta">赞 6464　藏 4222　评 1123</div><p class="origin-comment">TA 的原始评论：厂址在哪里？怎么联系、能否看看材质和案例？</p></section>`,`${btn('评论 TA','ai-comment','btn-secondary')}${btn('关闭','close','btn-quiet')}`);
    }

    function billingRechargeModal(){
      const packs=[['基础包','5,000积分 · 约167条线索 · 6个月有效','¥69','折合¥13.8/千积分',''],['标准包','15,000积分 · 约500条线索 · 12个月有效','¥179','折合¥11.9/千积分',''],['高级包','50,000积分 · 约1,667条线索 · 12个月有效','¥499','折合¥10.0/千积分','旗舰版专享']];
      return modalShell('积分充值','以下为价目参考，开通请扫码联系常经理。',`<div>${packs.map(p=>`<article class="recharge-pack"><div><h3>${p[0]} ${p[4]?'<span class="badge orange">'+p[4]+'</span>':''}</h3><p>${p[1]}</p></div><aside><strong>${p[2]}</strong><small>${p[3]}</small></aside></article>`).join('')}</div><div class="billing-note"><p>如需充值积分，请扫码联系常经理</p><div class="qr-placeholder" aria-label="客户经理微信二维码示意"></div><p>扫码添加常经理微信</p></div>`,btn('关闭','close','btn-quiet'));
    }

    function billingPlanModal(){
      const selected=state.selectedPlan;
      return modalShell(`变更为${selected}`,'套餐变更请扫码联系常经理协助您完成。',`<div class="notice"><strong>${selected}</strong><br>确认套餐、支付和生效时间均由客户经理协助处理。</div><div class="billing-note"><div class="qr-placeholder" aria-label="客户经理微信二维码示意"></div><p>扫码添加常经理微信</p></div>`,btn('关闭','close','btn-quiet'));
    }

    function billingDetailDrawer(){
      const sub=state.billingDetailTab==='sub';
      return `<div class="billing-drawer-layer" data-action="close"><aside class="billing-drawer" role="dialog" aria-modal="true" aria-label="积分明细" onclick="event.stopPropagation()"><header class="drawer-head"><h2>积分明细</h2><button class="close" data-action="close" aria-label="关闭">×</button></header><div class="drawer-body"><section class="drawer-total"><span>总积分</span><strong>1,225</strong><span>积分</span><div class="drawer-grid"><div><span>订阅积分</span><b>1,225 / 12,000</b><div class="points-progress"><span></span></div></div><div><span>活动积分</span><b>0</b></div></div></section><div class="drawer-tabs"><button class="${sub?'active':''}" data-action="billing-detail-sub">订阅积分</button><button class="${!sub?'active':''}" data-action="billing-detail-activity">活动积分</button></div>${sub?`<article class="drawer-record"><div style="display:flex;justify-content:space-between;gap:12px"><strong>订阅积分（本期）</strong><b>1,225 积分</b></div><p>套餐额度 12,000 · 已用 10,775 · 有效期至 2026.08.29</p></article>`:'<p class="muted" style="text-align:center;padding:32px 0;margin:0">暂无活动积分</p>'}</div></aside></div>`;
    }

    function billingGuideModal(){
      return modalShell('订阅管理新手引导','了解套餐、余额与积分使用。',`<ol class="outline"><li><b>套餐与余额：</b>查看当前版本、到期时间和本期积分。</li><li><b>积分消耗：</b>按任务查看每一笔消耗。</li><li><b>变更套餐 / 充值：</b>需要升级或补充积分时，扫码联系客户经理。</li></ol>`,btn('知道了','close','btn-primary'));
    }

    function billingConsumptionView(){
      const rows=[['情绪试管-演示','内容任务','2026/08/14 16:09','-76'],['中医','获客任务','2026/08/13 20:23','-2,130'],['长白山0812','获客任务','2026/08/12 15:43','-416'],['竞品监控','竞品监控','2026/08/12 15:38','-300'],['竞品搜索','竞品监控','2026/08/12 15:37','-880'],['调优-水光针','获客任务','2026/08/12 15:32','-477'],['追爆·你要卖土特产，就不要写土特产','内容任务','2026/08/09 19:59','-34']];
      return `<div class="usage-toolbar"><select class="select" style="width:130px" aria-label="积分消耗时间范围"><option>近3天</option><option>近7天</option><option selected>近一个月</option><option>自定义</option></select><div class="date-range"><input class="input" value="2026-07-16" aria-label="开始日期"><span>→</span><input class="input" value="2026-08-14" aria-label="结束日期"></div></div><section class="card panel"><div class="muted">累计用量 <strong style="font-size:25px;color:var(--ink);margin-left:5px">15,150</strong> 积分</div><div class="metrics grid usage-summary" style="margin:16px 0 0"><article class="metric card"><span class="metric-label">内容任务</span><strong>225积分</strong></article><article class="metric card"><span class="metric-label">获客任务</span><strong>13,745积分</strong></article><article class="metric card"><span class="metric-label">竞品监控</span><strong>1,180积分</strong></article></div></section><section class="card usage-table"><div class="queue-head" style="padding-top:17px"><h2 class="section-title" style="margin:0">全部用量</h2><div class="pill-row"><button class="pill active">全部任务</button><button class="pill">内容任务</button><button class="pill">获客任务</button><button class="pill">竞品监控</button></div></div><div class="usage-head"><span>任务名称</span><span>任务类型</span><span>最近使用时间</span><span>累计积分消耗</span></div>${rows.map(r=>`<div class="usage-row"><strong>${r[0]}</strong><span><span class="badge">${r[1]}</span></span><span>${r[2]}</span><b class="usage-minus">${r[3]}</b></div>`).join('')}</section>`;
    }

    function billing(){
      const subscription=state.billingTab!=='usage';
      const cycle=state.billingCycle;
      const plans=[{tier:'trial',name:'试用版',monthly:'¥0',yearly:'—',points:'2,100积分（7天）',cap:'10条',features:['线索获客（小红书）','线索获客（抖音）','AI智能关键词推荐','7天免费试用']},{tier:'advanced',name:'高级版 ⭐',monthly:'¥398',yearly:'¥3,980',points:'12,000积分/月',cap:'20条',hot:true,features:['试用版全部权益','优先技术支持','3个月免费试用爆款内容']},{tier:'flagship',name:'旗舰版',monthly:'¥728',yearly:'¥7,280',points:'30,000积分/月',cap:'20条',features:['高级版全部权益','爆款内容生成','专属 AI 训练与优化','多任务并发执行','1v1专属客户经理','优先功能体验权','1年免费试用后续所有新功能']}];
      const visiblePlans=cycle==='yearly'?plans.filter(p=>p.tier!=='trial'):plans;
      const planCard=p=>`<article class="card plan-option ${p.tier==='advanced'?'featured':''}">${p.hot?'<span class="badge orange hot">热门</span>':''}<h3>${p.name}</h3><div class="plan-price"><strong>${cycle==='yearly'?p.yearly:p.monthly}</strong><span>/${cycle==='yearly'?'年':'月'}</span>${cycle==='yearly'&&p.tier!=='trial'?'<span class="badge orange">买10送2</span>':''}</div><div class="plan-meta"><span>积分 <b>${p.points}</b></span><span>单次上限 <b>${p.cap}</b></span></div><ul class="plan-features">${p.features.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn ${p.tier==='advanced'?'btn-quiet':'btn-secondary'}" ${p.tier==='advanced'?'disabled':''} data-action="select-plan-${p.tier}">${p.tier==='advanced'?'当前版本':`变更为${p.name}`}</button></article>`;
      const content=subscription?`<section class="billing-overview-grid"><article class="card plan-status-card"><span class="badge orange">生效中</span><h2>高级版</h2><p>套餐将于 2026.08.29 到期</p></article><article class="card points-overview"><div class="points-top"><div class="points-total"><span>总积分</span><strong>1,225</strong><span>积分</span></div><div class="task-actions"><button class="btn btn-quiet" data-action="billing-details">积分明细</button><button class="btn btn-secondary" data-action="billing-recharge">积分充值</button><button class="btn btn-primary" data-action="bill-change">变更套餐</button></div></div><div class="points-breakdown"><div><span>订阅积分</span><b>1,225 / 12,000</b><div class="points-progress"><span></span></div></div><div><span>增购积分</span><b>0</b><button class="btn btn-quiet" style="padding:4px 8px;margin-top:8px;font-size:12px" data-action="billing-recharge">充值</button></div><div><span>活动积分</span><b>0</b></div></div></article></section><section id="plan-section"><div class="plans-head"><h2 class="section-title" style="margin:0">选择套餐</h2><div class="billing-cycle"><button class="${cycle==='monthly'?'active':''}" data-action="billing-cycle-monthly">月费</button><button class="${cycle==='yearly'?'active':''}" data-action="billing-cycle-yearly">年费 <span class="badge orange">83折</span></button></div></div><div class="plan-grid">${visiblePlans.map(planCard).join('')}</div></section>`:billingConsumptionView();
      return pageHead('订阅与积分','管理当前套餐、剩余积分和使用记录。',btn('？ 新手引导','billing-guide','btn-quiet'))+`<div class="billing-page-tabs"><button class="${subscription?'active':''}" data-action="bill-subscription">订阅管理</button><button class="${!subscription?'active':''}" data-action="bill-usage">积分消耗</button></div>${content}</section>`;
    }

    function modal(){
      if(state.modal==='billing-details')return billingDetailDrawer();
      if(state.modal==='billing-recharge')return billingRechargeModal();
      if(state.modal==='billing-plan')return billingPlanModal();
      if(state.modal==='billing-guide')return billingGuideModal();
      if(state.modal==='keyword')return keywordModal();
      if(state.modal==='content')return contentModal();
      if(state.modal==='insight')return insightModal();
      if(state.modal==='lead')return leadModal();
      if(state.modal==='commentcopy')return commentCopyModal();
      if(state.modal==='cover')return coverModal();
      if(state.modal==='choose')return chooseModal();
      return '';
    }

    function billingDetailDrawer(){
      const sub=state.billingDetailTab==='sub';
      const record=sub?`<article class="drawer-record"><div style="display:flex;justify-content:space-between;gap:12px"><strong>订阅积分（本期）</strong><b>1,225 积分</b></div><p>套餐额度 12,000 · 已用 10,775 · 有效期至 2026.08.29</p></article>`:'<p class="muted" style="text-align:center;padding:32px 0;margin:0">暂无活动积分</p>';
      return `<div class="billing-drawer-layer" data-action="close"><aside class="billing-drawer" data-action="drawer-content" role="dialog" aria-modal="true" aria-label="积分明细"><header class="drawer-head"><h2>积分明细</h2><button class="close" data-action="close" aria-label="关闭">×</button></header><div class="drawer-body"><section class="drawer-total"><span>总积分</span><strong>1,225</strong><span>积分</span><div class="drawer-grid"><div><span>订阅积分</span><b>1,225 / 12,000</b><div class="points-progress"><span></span></div></div><div><span>活动积分</span><b>0</b></div></div></section><div class="drawer-tabs"><button class="${sub?'active':''}" data-action="billing-detail-sub">订阅积分</button><button class="${!sub?'active':''}" data-action="billing-detail-activity">活动积分</button></div>${record}</div></aside></div>`;
    }

    document.addEventListener('click',e=>{
      const b=e.target.closest('[data-action]');if(!b)return;
      const action=b.dataset.action;
      if(action==='open-lead-detail'||action==='analyze-ta'){state.leadDetail=b.dataset.leadName||'星子';state.leadFocus=action==='analyze-ta'?'analysis':'detail';state.modal='lead';render();return;}
      if(action==='open-source-post'){toast('将跳转到小红书来源帖查看原文');return;}
      if(action==='billing-details'||action==='billing-recharge'||action==='billing-guide'){state.modal=action;render();return;}
      if(action==='bill-change'){root.querySelector('#plan-section')?.scrollIntoView({behavior:'smooth'});return;}
      if(action==='billing-cycle-monthly'||action==='billing-cycle-yearly'){state.billingCycle=action.endsWith('yearly')?'yearly':'monthly';render();return;}
      if(action==='billing-detail-sub'||action==='billing-detail-activity'){state.billingDetailTab=action.endsWith('activity')?'activity':'sub';render();return;}
      if(action.startsWith('select-plan-')&&!b.disabled){state.selectedPlan={trial:'试用版',flagship:'旗舰版'}[action.replace('select-plan-','')]||'高级版';state.modal='billing-plan';render();return;}
    });

    /* Final interaction pass: keeps the original product structure while
       making the prototype's cross-page onboarding state explicit. */
    const basePageHead=pageHead;
    pageHead=function(title,sub,actions=''){
      const isFinalOnboarding=state.user==='new'&&state.onboardStep===3&&(state.route==='content'||state.route==='insights');
      const progress=isFinalOnboarding?`<div class="onboarding-return"><div><strong>首次使用 · 第 3 / 3 步</strong><small>完成这项任务后，内容和结果会自动沉淀，下一次任务可以继续使用。</small></div><button class="btn btn-quiet" data-route="dashboard">稍后回工作台</button></div>`:'';
      return basePageHead(title,sub,actions)+progress;
    };
    const baseRender=render;
    render=function(){
      baseRender();
      const credit=root.querySelector('.credit-card strong');
      if(credit)credit.textContent='1,225';
      root.querySelectorAll('.large-credit-ring').forEach(el=>el.style.position='relative');
      const currentPlan=root.querySelector('.plan-option.featured .btn');
      if(currentPlan){currentPlan.disabled=true;currentPlan.setAttribute('aria-disabled','true');}
      if(state.user==='new'&&state.onboardStep===1&&state.route==='keywords'){
        const guide=root.querySelector('.onboarding-return');
        if(guide&&!guide.querySelector('[data-action="complete-keyword-onboarding"]')){
          guide.insertAdjacentHTML('beforeend','<button class="btn btn-secondary" data-action="complete-keyword-onboarding">完成配置，返回工作台</button>');
        }
      }
    };
    document.addEventListener('click',e=>{
      const button=e.target.closest('[data-action="complete-keyword-onboarding"]');
      if(!button)return;
      state.keywordConfigured=true;
      state.onboardStep=2;
      state.route='dashboard';
      state.modal=null;
      render();
      toast('已完成关键词库配置，继续第 2 步');
    });
    document.addEventListener('click',e=>{
      const button=e.target.closest('[data-action]');
      if(!button)return;
      if((button.dataset.action==='new-content'||button.dataset.action==='new-insight')&&state.user==='new'&&state.onboardStep===3){
        render();
      }
    });
    render();
  </script>
</body>
</html>
